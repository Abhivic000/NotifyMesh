server:
  port: 8082

spring:
  application:
    name: notification-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notification_platform}
    username: ${POSTGRES_USER:notification_app}
    password: ${POSTGRES_PASSWORD:local_dev_only_change_me}
    hikari:
      schema: notification

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: notification

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Separate schema from event-ingestion-service, sharing one Postgres instance -
    # see that service's application.yml for why this is required, not optional,
    # once two services' Flyway histories share a physical database.
    schemas: notification
    create-schemas: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

    consumer:
      group-id: notification-service-group
      # New consumer group, first-ever start: read from the beginning of the topic
      # rather than skipping everything already published before this service existed.
      auto-offset-reset: earliest
      # Paired with listener.ack-mode=RECORD below - offsets commit only after a
      # message is fully processed, not on a timer. See EventConsumer's Javadoc.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: RECORD
      observation-enabled: true

    template:
      observation-enabled: true

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

notification:
  events:
    topic: notification.events
  channels:
    email-topic: notification.email
    sms-topic: notification.sms
    push-topic: notification.push
