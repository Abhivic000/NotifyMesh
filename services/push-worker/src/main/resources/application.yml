server:
  port: 8085

spring:
  application:
    name: push-worker

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notification_platform}
    username: ${POSTGRES_USER:notification_app}
    password: ${POSTGRES_PASSWORD:local_dev_only_change_me}
    hikari:
      schema: push_worker

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: push_worker

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: push_worker
    create-schemas: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: push-worker-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: RECORD
      observation-enabled: true

    template:
      observation-enabled: true

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    instances:
      pushProvider:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

notification:
  channels:
    push-topic: notification.push
    push-dlq-topic: notification.push.dlq
  provider:
    push:
      failure-rate: ${PUSH_PROVIDER_FAILURE_RATE:0.1}
    timeout-ms: ${PROVIDER_TIMEOUT_MS:3000}
    simulated-timeout-latency-ms: ${PROVIDER_SIMULATED_TIMEOUT_LATENCY_MS:5000}
  idempotency:
    ttl-hours: 24
  ratelimit:
    per-recipient-per-minute: ${NOTIFICATION_RATE_LIMIT:100}
  retry:
    max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:5}
    delays-ms: ${NOTIFICATION_RETRY_DELAYS_MS:5000,30000,120000,600000}
    jitter-factor: ${NOTIFICATION_RETRY_JITTER:0.2}
    poll-interval-ms: ${NOTIFICATION_RETRY_POLL_INTERVAL_MS:2000}

security:
  jwt:
    secret: ${JWT_SECRET}
