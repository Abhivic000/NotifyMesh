server:
  port: 8081

spring:
  application:
    name: event-ingestion-service

  datasource:
    # Defaults match .env.example so this works out of the box for local dev
    # without needing to source .env into the shell - real environments must
    # override these via actual environment variables, never edit the default.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notification_platform}
    username: ${POSTGRES_USER:notification_app}
    password: ${POSTGRES_PASSWORD:local_dev_only_change_me}

    hikari:
      schema: event_ingestion

  jpa:
    hibernate:
      # Flyway owns the schema, not Hibernate. 'validate' makes Hibernate check
      # entities match the DB and fail loudly on mismatch - it must never be
      # 'update' or 'create', which would let two systems fight over the schema.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: event_ingestion

  flyway:
    enabled: true
    locations: classpath:db/migration
    # This service and notification-service share one physical Postgres instance
    # (a deliberate v1 simplification - see the shared-DB ADR), but Flyway's
    # migration history is per-database, not per-service: without separate schemas,
    # this service's V1/V2 and notification-service's V1/V2 collide on version
    # number with different SQL/checksums. A dedicated schema per service is what
    # actually enforces "shared instance, separate ownership" at the DB level.
    schemas: event_ingestion
    create-schemas: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      # Wraps producer sends in a Micrometer Observation, which is what actually
      # propagates the current trace context into the outgoing Kafka message's
      # headers - without this, a trace started at the HTTP layer stops dead the
      # moment a message hits Kafka.
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        # Producer-level idempotency - a DIFFERENT layer from the DB idempotency check in
        # EventIngestionService. This one stops the Kafka client itself from writing a
        # duplicate record when it silently retries a send after a network blip; it says
        # nothing about duplicate *business* events.
        enable.idempotence: true

notification:
  outbox:
    topic: notification.events
    poll-interval-ms: 1000
    batch-size: 50

security:
  # No default - a missing secret must fail startup loudly, never silently run
  # with an empty/guessable key.
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # 100% sampling - correct for a portfolio demo where you want to SEE every
      # trace; a real production system would sample a small fraction to control
      # tracing-backend volume/cost.
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    distribution:
      # Real p95/p99 percentiles need histogram buckets, not just avg/max - this is
      # what lets Grafana use histogram_quantile() against real data.
      percentiles-histogram:
        http.server.requests: true
