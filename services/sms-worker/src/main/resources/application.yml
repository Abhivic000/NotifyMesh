server:
  port: 8084

spring:
  application:
    name: sms-worker

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notification_platform}
    username: ${POSTGRES_USER:notification_app}
    password: ${POSTGRES_PASSWORD:local_dev_only_change_me}
    hikari:
      schema: sms_worker

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: sms_worker

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: sms_worker
    create-schemas: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: sms-worker-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: RECORD

management:
  endpoints:
    web:
      exposure:
        include: health,info

notification:
  channels:
    sms-topic: notification.sms
  provider:
    sms:
      failure-rate: ${SMS_PROVIDER_FAILURE_RATE:0.1}
  idempotency:
    ttl-hours: 24
