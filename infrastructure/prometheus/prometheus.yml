global:
  scrape_interval: 5s

scrape_configs:
  # Services run on the host machine (IntelliJ/java -jar per PRD section 81), not
  # inside Docker - Prometheus (which IS in Docker) reaches them via
  # host.docker.internal, Docker Desktop's DNS name for the host, not localhost
  # (which inside the container would mean the container itself).
  - job_name: event-ingestion-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: email-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]

  - job_name: sms-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]

  - job_name: push-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8085"]
